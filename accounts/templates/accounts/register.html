{% extends 'books/base.html' %}
{% block content %}

<div class="container mt-5">
    <h2>Create an Account</h2>
    <form method="POST">

        {% csrf_token %}
        {{ form.as_p}}
        <button class="btn btn-primary">
            Register
        </button>
        <p>Already a user?</p>
        <a href="{% url 'login' %}">Login</a>
    </form>
</div>

{% endblock %}
