{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login/SignUp - House of Books</title>
    <link rel="stylesheet"
          href="{% static 'auth.css' %}">
    <link rel="preconnect"
          href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500&display=swap"
          rel="stylesheet">
</head>
<body>
<div class="auth-container">
    <div class="auth-card">
        <h1>House of Books</h1>
        <p class="subtitle">Every book has its reader.</p>
        <!-- Login form -->
        <div id="login-form">
            <h2>Sign In</h2>
            <form method="POST">

                {% csrf_token %}

                {{ login_form.as_p }}
                <button type="submit" name="login">Login</button>
            </form>
            <p>
                New here?
                <span onclick="showRegister()">Create an account</span>
            </p>
        </div>

        <!-- Register form -->
        <div id="register-form">
            <h2>Create Account</h2>
            <form method="POST">
                {% csrf_token %}

                {{ register_form.as_p }}
                <button type="submit" name="register">Register</button>
            </form>
            <p>
                Already a member?
                <span onclick="showLogin()">Sign In</span>
            </p>
        </div>
    </div>
</div>
<script src="{% static 'auth.js' %}">
    document.addEventListener("DOMContentLoaded", function() {
        let activeForm = "{{ active_form }}";
        if(activeForm === "register"){
            showRegister();
        }
        else{
            showLogin();
        }
    });
    
</script>
</body>
</html>
