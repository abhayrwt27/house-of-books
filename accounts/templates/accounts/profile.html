{% extends 'books/base.html' %}
{% block content %}

<div class="container mt-5">
    <div class="card shadow profile-card p-4">
        <div class="text-center">
            <div class="profile-avatar">
                avatar
            </div>
            <h2 class="mt-3">{{ user.username }}</h2>
            <p class="text-muted">
                {{ user.first_name }} {{ user.last_name }}
            </p>
        </div>
        <hr>
        <p><strong>Email:</strong> {{request.user.email}}</p>
        <p><strong>Total Orders:</strong> {{orders}}</p>
        <p><strong>Total Reviews:</strong> {{reviews}}</p>
        
        <div class="profile-buttons mt-3">
            <a href="{% url 'edit_profile' %}" class="btn btn-primary">Edit Profile</a>
            <a href="{% url 'change_password' %}" class="btn btn-warning">Change Password</a>
        </div>
    </div>
</div>

{% endblock %}
