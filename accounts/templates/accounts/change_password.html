{% extends 'books/base.html' %}
{% block content %}

<div class="container mt-5">
    <div class="card shadow p-4">
        <h2>Change Password</h2>
        <hr>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn btn-primary">Change Password</button>
            <a href="{% url 'profile' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>

{% endblock %}
