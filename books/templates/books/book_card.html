            <div class="col-md-4">
                    <div class="card h-100 shadow-sm">
                        {% if book.cover_image %}
                            <img src="{{ book.cover_image.url }}" class="card-img-top" alt="{{book.title}}">
                        {% else %}
                            <div class="text-center p-5 bg-light">No Image Available</div>
                        {% endif %}
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title">{{ book.title }}</h5>
                            <p><strong>Author:</strong> {{book.author}}</p>
                            <p><strong>Genre:</strong> {{book.genre}}</p>
                            <p class="card-text">{{book.description|truncatewords:20}}</p>
                            <h6 class="text-success">₹{{book.price}}</h6>
                            <a href="{% url 'book_detail' book.id %}" class="btn btn-primary w-100 mt-auto">View Details</a>
                        </div>
                    </div>
            </div>
