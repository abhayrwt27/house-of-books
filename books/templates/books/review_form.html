{% extends "books/base.html" %}
{% block content %}

<div class="container mt-4">
    <h2>Review for "{{book.title}}"</h2>
    <form method="POST">
        {% csrf_token %}
        {{form.as_p}}
        <button type="submit" class="btn btn-primary">Submit Review</button>
    </form>
</div>

{% endblock %}
