{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>404 • House of Books</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{% static 'css/style.css' %}">
</head>

<body class="hob-error-body">

    <div class="hob-error-container">

        <div class="hob-error-code">
            404
        </div>

        <h1 class="hob-error-title">
            Page Not Found!<br>
            This page fell off the shelf.
        </h1>

        <p class="hob-error-text">
            The page you're looking for couldn't be found.
            Every reader loses a page sometimes.
        </p>

        <div class="hob-book">
            📖
        </div>

        <a href="{% url 'home' %}"
           class="hob-button">

            Return to Library

        </a>

    </div>

</body>

</html>
