{% load static %}

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>404 - House of Books</title>
        <link rel="stylesheet" href="{% static 'books/style.css' %}">
    </head>
    <body>
        <div class="hob-error-container">
            <!-- Falling Book -->
             <div class="hob-book">
                <div class="hob-book-cover-front"></div>
                <div class="hob-book-pages"></div>
                <div class="hob-book-cover-back"></div>
             </div>

             <!-- Hidden Paper -->
              <div id="hob-error-paper">
                <h1>404 : Page Not Found</h1>
                <p>This page fell off the shelf.</p>
                <p class="hob-error-subtitle">
                    Every library has a misplaced book. Let's help you find your way back.
                </p>
                <div class="hob-error-buttons">
                    <a href="{% url 'home' %}" class="hob-error-btn">Return Home</a>
                </div>
              </div>
        </div>
        <script src="{% static 'books/js/404.js' %}"></script>
    </body>
</html>
