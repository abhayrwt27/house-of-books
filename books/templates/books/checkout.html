{% extends "books/base.html" %}
{% block content %}

<div class="checkout-container">
    <h1 class="checkout-heading">Checkout</h1>
    <div class="checkout-grid">

        <!-- Shipping note -->

        <div class="sticky-note shipping-note">

            <h2>📦 Shipping Details</h2>

            <form method="POST">
                {% csrf_token %}

                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text"
                           value="{{ user.first_name }} {{ user.last_name }}">
                </div>

                <div class="input-group">
                    <label>Email</label>
                    <input type="email"
                           value="{{ user.email }}">
                </div>

                <div class="input-group">
                    <label>Phone Number</label>
                    <input type="text">
                </div>

                <div class="input-group">
                    <label>Address</label>
                    <textarea rows="4"></textarea>
                </div>

                <div class="input-group">
                    <label>City</label>
                    <input type="text">
                </div>
                <div class="input-group">
                    <label>PIN Code</label>
                    <input type="text">
                </div>
        </div>

        <!-- Order note -->

        <div class="sticky-note order-note">
            <h2>🛒 Order Summary</h2>

            {% for item in cart_items %}
                <div class="book-item">
                    <div>
                        <h4>{{ item.book.title }}</h4>
                        <p>Quantity: {{ item.quantity }}</p>
                    </div>
                    <div>
                        ₹{{ item.subtotal }}
                    </div>
                </div>
            {% endfor %}

            <hr>

            <div class="total-price">
                <h3>Total</h3>
                <h3>₹{{ cart.total }}</h3>
            </div>
        </div>
    </div>

    <!-- Payment note -->

    <div class="sticky-note payment-note">

        <h2>💳 Payment Method</h2>

        <div class="payment-option">
            <input type="radio"
                   name="payment"
                   value="cod"
                   checked>
            <label>Cash on Delivery</label>
        </div>

        <div class="payment-option">
            <input type="radio"
                   name="payment"
                   value="razorpay">
            <label>Razorpay</label>
        </div>

        <button type="submit" class="place-order-btn">Place Order</button>

    </div>

    </form>

</div>

{% endblock %}
